[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "reference-bff"
version = "0.1.0"
description = "Reference browser-facing OAuth transaction foundation"
readme = "README.md"
requires-python = ">=3.14.4,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "uvicorn==0.52.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reference_bff"]
