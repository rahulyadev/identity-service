name: release production images

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: identity-production-image-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate:
    name: Validate exact source
    if: ${{ github.repository == 'rahulyadev/identity-service' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.pull_request == null && github.head_ref == '' && github.base_ref == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Guard dispatch context
        timeout-minutes: 1
        env:
          EXPECTED_REPOSITORY: rahulyadev/identity-service
          EXPECTED_EVENT: workflow_dispatch
          EXPECTED_REF: refs/heads/main
        run: |
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_EVENT_NAME" == "$EXPECTED_EVENT" ]]
          [[ "$GITHUB_REF" == "$EXPECTED_REF" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${GITHUB_HEAD_REF:-}" ]]
          [[ -z "${GITHUB_BASE_REF:-}" ]]

      - name: Check out exact dispatch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        timeout-minutes: 1
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        timeout-minutes: 5
        with:
          python-version: 3.14.4
          check-latest: false

      - name: Install locked validation environment
        timeout-minutes: 10
        run: make sync

      - name: Run complete repository validation
        timeout-minutes: 35
        run: make validate

  release:
    name: Build and publish immutable ARM64 images
    needs: validate
    if: ${{ needs.validate.result == 'success' && github.repository == 'rahulyadev/identity-service' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.pull_request == null && github.head_ref == '' && github.base_ref == '' }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      AWS_ACCOUNT_ID: "402906459349"
      AWS_REGION: ap-south-1
      AWS_ROLE_ARN: arn:aws:iam::402906459349:role/platform-infrastructure-production-identity-deployer
      ECR_REGISTRY: 402906459349.dkr.ecr.ap-south-1.amazonaws.com
      API_REPOSITORY: platform-infrastructure-production-identity-api
      BFF_REPOSITORY: platform-infrastructure-production-identity-bff
      API_IMAGE: 402906459349.dkr.ecr.ap-south-1.amazonaws.com/platform-infrastructure-production-identity-api
      BFF_IMAGE: 402906459349.dkr.ecr.ap-south-1.amazonaws.com/platform-infrastructure-production-identity-bff
      API_DOCKERFILE: Dockerfile
      BFF_DOCKERFILE: examples/reference_bff/Dockerfile
      BUILD_TARGET: runtime
      BUILD_PLATFORM: linux/arm64
      RELEASE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - name: Guard release context
        timeout-minutes: 1
        env:
          EXPECTED_REPOSITORY: rahulyadev/identity-service
          EXPECTED_EVENT: workflow_dispatch
          EXPECTED_REF: refs/heads/main
        run: |
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_EVENT_NAME" == "$EXPECTED_EVENT" ]]
          [[ "$GITHUB_REF" == "$EXPECTED_REF" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${GITHUB_HEAD_REF:-}" ]]
          [[ -z "${GITHUB_BASE_REF:-}" ]]
          [[ "$RELEASE_TAG" =~ ^sha-[0-9a-f]{40}-run-[1-9][0-9]*-attempt-[1-9][0-9]*$ ]]

      - name: Check out exact dispatch source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        timeout-minutes: 1
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Set up pinned ARM64 emulation
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        timeout-minutes: 5
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
          platforms: arm64
          cache-image: true

      - name: Set up pinned Buildx
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        timeout-minutes: 5
        with:
          version: v0.36.1
          driver: docker-container
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          install: false
          use: true
          cleanup: true

      - name: Verify ARM64 builder support
        timeout-minutes: 2
        env:
          BUILDER_PLATFORMS: ${{ steps.buildx.outputs.platforms }}
        run: |
          export LC_ALL=C
          platforms="${BUILDER_PLATFORMS:-}"
          platform_pattern='[a-z0-9]+/[a-z0-9]+(/[a-z0-9]+)?'
          if (( ${#platforms} == 0 || ${#platforms} > 4096 )) ||
             [[ ! "$platforms" =~ ^${platform_pattern}(,${platform_pattern})*$ ]]; then
            printf '%s\n' 'invalid builder platforms' >&2
            exit 1
          fi
          if [[ ",$platforms," != *,linux/arm64,* ]]; then
            printf '%s\n' 'ARM64 builder unavailable' >&2
            exit 1
          fi

      - name: Prebuild API ARM64 OCI image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          pull: true
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/identity-api-${{ github.run_id }}-${{ github.run_attempt }}.oci
          labels: |
            org.opencontainers.image.source=https://github.com/rahulyadev/identity-service
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Prebuild BFF ARM64 OCI image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        timeout-minutes: 30
        with:
          context: .
          file: examples/reference_bff/Dockerfile
          target: runtime
          platforms: linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          pull: true
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/identity-bff-${{ github.run_id }}-${{ github.run_attempt }}.oci
          labels: |
            org.opencontainers.image.source=https://github.com/rahulyadev/identity-service
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        timeout-minutes: 3
        with:
          role-to-assume: arn:aws:iam::402906459349:role/platform-infrastructure-production-identity-deployer
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-duration-seconds: 900
          role-session-name: identity-release-${{ github.run_id }}-${{ github.run_attempt }}
          output-credentials: false
          unset-current-credentials: true

      - name: Authenticate to exact ECR registry
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        timeout-minutes: 3
        with:
          registries: "402906459349"
          mask-password: true
          skip-logout: false

      - name: Push API immutable image
        id: push-api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          pull: true
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/rahulyadev/identity-service
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Validate API digest
        timeout-minutes: 1
        env:
          API_DIGEST: ${{ steps.push-api.outputs.digest }}
        run: |
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'API immutable image: `%s@%s`\n' "$API_IMAGE" "$API_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest API digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        timeout-minutes: 5
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.push-api.outputs.digest }}
          push-to-registry: true

      - name: Push BFF immutable image
        id: push-bff
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        timeout-minutes: 30
        with:
          context: .
          file: examples/reference_bff/Dockerfile
          target: runtime
          platforms: linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          pull: true
          push: true
          tags: ${{ env.BFF_IMAGE }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/rahulyadev/identity-service
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Validate BFF digest
        timeout-minutes: 1
        env:
          BFF_DIGEST: ${{ steps.push-bff.outputs.digest }}
        run: |
          [[ "$BFF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'BFF immutable image: `%s@%s`\n' "$BFF_IMAGE" "$BFF_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest BFF digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        timeout-minutes: 5
        with:
          subject-name: ${{ env.BFF_IMAGE }}
          subject-digest: ${{ steps.push-bff.outputs.digest }}
          push-to-registry: true

      - name: Write bounded release manifest
        timeout-minutes: 2
        env:
          SOURCE_REPOSITORY: rahulyadev/identity-service
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          API_DIGEST: ${{ steps.push-api.outputs.digest }}
          BFF_DIGEST: ${{ steps.push-bff.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          sha = os.environ["SOURCE_SHA"]
          api_digest = os.environ["API_DIGEST"]
          bff_digest = os.environ["BFF_DIGEST"]
          run_id = os.environ["WORKFLOW_RUN_ID"]
          run_attempt = os.environ["WORKFLOW_RUN_ATTEMPT"]
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("invalid source identity")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", api_digest) is None:
              raise SystemExit("invalid API image identity")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", bff_digest) is None:
              raise SystemExit("invalid BFF image identity")
          if re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None:
              raise SystemExit("invalid workflow run identity")
          if re.fullmatch(r"[1-9][0-9]{0,9}", run_attempt) is None:
              raise SystemExit("invalid workflow attempt identity")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["SOURCE_REPOSITORY"],
              "source_sha": sha,
              "workflow": {"run_id": int(run_id), "run_attempt": int(run_attempt)},
              "platform": "linux/arm64",
              "images": {
                  "api": {
                      "reference": f"{os.environ['API_IMAGE']}@{api_digest}",
                      "sbom": "attached",
                      "provenance": "max",
                      "attestation": "github-bound",
                  },
                  "bff": {
                      "reference": f"{os.environ['BFF_IMAGE']}@{bff_digest}",
                      "sbom": "attached",
                      "provenance": "max",
                      "attestation": "github-bound",
                  },
              },
          }
          Path("release-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 3
        with:
          name: identity-production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          overwrite: false
          include-hidden-files: false

      - name: Report non-deployable partial release
        if: ${{ failure() && steps.push-api.outputs.digest != '' }}
        timeout-minutes: 1
        env:
          API_DIGEST: ${{ steps.push-api.outputs.digest }}
          BFF_DIGEST: ${{ steps.push-bff.outputs.digest }}
        run: |
          printf 'Release state: `NOT_DEPLOYABLE`\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Partial immutable API image: `%s@%s`\n' "$API_IMAGE" "$API_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$BFF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Partial immutable BFF image: `%s@%s`\n' "$BFF_IMAGE" "$BFF_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove local release files
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          rm -f -- \
            "$RUNNER_TEMP/identity-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.oci" \
            "$RUNNER_TEMP/identity-bff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.oci" \
            release-manifest.json
